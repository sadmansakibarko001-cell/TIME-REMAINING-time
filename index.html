<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Midnight Hourglass</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #05060a;
      font-family: 'Courier New', monospace;
    }

    #ui {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      pointer-events: none;
      z-index: 100;
    }

    .countdown {
      font-size: clamp(48px, 8vw, 120px);
      font-weight: 700;
      color: #eaf2ff;
      letter-spacing: 0.05em;
      text-shadow:
        0 0 15px rgba(120, 190, 255, 0.6),
        0 0 30px rgba(120, 190, 255, 0.4),
        0 0 45px rgba(120, 190, 255, 0.2);
      transition: filter 0.15s ease-out;
    }

    .countdown span {
      display: inline-block;
      min-width: 2ch;
      text-align: center;
    }

    canvas {
      display: block;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <div id="ui">
    <div class="countdown">
      <span id="hh">00</span>:<span id="mm">00</span>:<span id="ss">00</span>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/postprocessing/EffectComposer.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/postprocessing/RenderPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.150.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

  <script>
    // TIME FUNCTIONS
    const TZ = "Asia/Dhaka";

    function getDhakaParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(date);
      
      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      
      return {
        year: parseInt(map.year, 10),
        month: parseInt(map.month, 10),
        day: parseInt(map.day, 10),
        hour: parseInt(map.hour, 10),
        minute: parseInt(map.minute, 10),
        second: parseInt(map.second, 10)
      };
    }

    function dhakaLocalToUtcMs({ year, month, day, hour = 0, minute = 0, second = 0 }) {
      const assumedUtc = Date.UTC(year, month - 1, day, hour, minute, second);
      const shown = getDhakaParts(new Date(assumedUtc));
      const shownAsUtc = Date.UTC(
        shown.year,
        shown.month - 1,
        shown.day,
        shown.hour,
        shown.minute,
        shown.second
      );
      const offsetMs = shownAsUtc - assumedUtc;
      return assumedUtc - offsetMs;
    }

    function msUntilNextDhakaMidnight(now = new Date()) {
      const p = getDhakaParts(now);
      const todayUtc = Date.UTC(p.year, p.month - 1, p.day);
      const tomorrowUtc = todayUtc + 24 * 60 * 60 * 1000;
      const tomorrow = new Date(tomorrowUtc);
      
      const nextMidnight = {
        year: tomorrow.getUTCFullYear(),
        month: tomorrow.getUTCMonth() + 1,
        day: tomorrow.getUTCDate(),
        hour: 0,
        minute: 0,
        second: 0
      };
      
      const nextMidnightUtcMs = dhakaLocalToUtcMs(nextMidnight);
      return nextMidnightUtcMs - now.getTime();
    }

    function hhmmssFromMs(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      
      return {
        h: String(h).padStart(2, "0"),
        m: String(m).padStart(2, "0"),
        s: String(s).padStart(2, "0")
      };
    }

    // THREE.JS SETUP
    const renderer = new THREE.WebGLRenderer({
      antialias: true,
      alpha: false
    });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.body.appendChild(renderer.domElement);

    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x05060a, 3, 12);

    const camera = new THREE.PerspectiveCamera(
      55,
      window.innerWidth / window.innerHeight,
      0.1,
      100
    );
    camera.position.set(0, 0.3, 4.5);

    // POST-PROCESSING
    const composer = new THREE.EffectComposer(renderer);
    composer.addPass(new THREE.RenderPass(scene, camera));

    const bloom = new THREE.UnrealBloomPass(
      new THREE.Vector2(window.innerWidth, window.innerHeight),
      0.8,
      0.4,
      0.2
    );
    composer.addPass(bloom);

    // LIGHTING
    scene.add(new THREE.AmbientLight(0x9cc9ff, 0.4));

    const keyLight = new THREE.DirectionalLight(0xffffff, 1.3);
    keyLight.position.set(2, 3, 2);
    scene.add(keyLight);

    const fillLight = new THREE.DirectionalLight(0x88bfff, 0.6);
    fillLight.position.set(-2, 1, -1);
    scene.add(fillLight);

    // HOURGLASS GLASS
    const glassGeometry = new THREE.CylinderGeometry(0.9, 0.9, 2.4, 64, 1, true);
    const glassMaterial = new THREE.MeshPhysicalMaterial({
      color: 0x88bfff,
      transparent: true,
      opacity: 0.1,
      roughness: 0.15,
      metalness: 0.0,
      transmission: 1.0,
      thickness: 0.5,
      side: THREE.DoubleSide
    });
    const glass = new THREE.Mesh(glassGeometry, glassMaterial);
    scene.add(glass);

    // PARTICLE SYSTEM
    const PARTICLE_COUNT = 15000;
    const positions = new Float32Array(PARTICLE_COUNT * 3);
    const velocities = new Float32Array(PARTICLE_COUNT * 3);

    function randomInCone(yMin, yMax, radius) {
      const y = THREE.MathUtils.lerp(yMin, yMax, Math.random());
      const angle = Math.random() * Math.PI * 2;
      const r = Math.sqrt(Math.random()) * radius;
      return {
        x: Math.cos(angle) * r,
        y: y,
        z: Math.sin(angle) * r
      };
    }

    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const p = randomInCone(0.3, 1.1, 0.6);
      positions[i * 3 + 0] = p.x;
      positions[i * 3 + 1] = p.y;
      positions[i * 3 + 2] = p.z;
      
      velocities[i * 3 + 0] = (Math.random() - 0.5) * 0.08;
      velocities[i * 3 + 1] = -(0.3 + Math.random() * 0.4);
      velocities[i * 3 + 2] = (Math.random() - 0.5) * 0.08;
    }

    const sandGeometry = new THREE.BufferGeometry();
    sandGeometry.setAttribute(
      "position",
      new THREE.BufferAttribute(positions, 3)
    );

    const sandMaterial = new THREE.PointsMaterial({
      color: 0x9fe7ff,
      size: 0.024,
      transparent: true,
      opacity: 0.95,
      blending: THREE.AdditiveBlending
    });

    const sand = new THREE.Points(sandGeometry, sandMaterial);
    scene.add(sand);

    function resetParticle(index) {
      const p = randomInCone(0.3, 1.1, 0.6);
      positions[index * 3 + 0] = p.x;
      positions[index * 3 + 1] = p.y;
      positions[index * 3 + 2] = p.z;
      
      velocities[index * 3 + 0] = (Math.random() - 0.5) * 0.08;
      velocities[index * 3 + 1] = -(0.3 + Math.random() * 0.4);
      velocities[index * 3 + 2] = (Math.random() - 0.5) * 0.08;
    }

    // UI ELEMENTS
    const ui = document.getElementById("ui");
    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");

    // ANIMATION STATE
    const state = {
      shake: 0,
      bloomBase: 0.8,
      bloomHit: 0,
      uiGlow: 0
    };

    let lastSecond = -1;
    let lastMinute = -1;

    // IMPACT FUNCTIONS
    function hitSecond() {
      state.bloomHit = 1.2;
      state.uiGlow = 0.8;
      state.shake = Math.max(state.shake, 0.4);
      
      gsap.to(state, {
        bloomHit: 0,
        uiGlow: 0,
        shake: 0,
        duration: 0.4,
        ease: "power3.out"
      });
    }

    function hitMinute() {
      state.bloomHit = 2.5;
      state.uiGlow = 2.0;
      state.shake = Math.max(state.shake, 1.0);
      
      gsap.to(state, {
        bloomHit: 0,
        uiGlow: 0,
        shake: 0,
        duration: 0.9,
        ease: "expo.out"
      });
    }

    function hitMidnight() {
      state.bloomHit = 7.0;
      state.uiGlow = 6.0;
      state.shake = 2.5;
      
      gsap.to(state, {
        bloomHit: 0,
        uiGlow: 0,
        shake: 0,
        duration: 1.5,
        ease: "expo.out"
      });
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        resetParticle(i);
      }
    }

    // ANIMATION LOOP
    gsap.ticker.lagSmoothing(500, 33);

    gsap.ticker.add(() => {
      const now = new Date();
      const time = performance.now() * 0.001;
      
      const msLeft = msUntilNextDhakaMidnight(now);
      const t = hhmmssFromMs(msLeft);
      
      hh.textContent = t.h;
      mm.textContent = t.m;
      ss.textContent = t.s;
      
      const currentSecond = now.getSeconds();
      const currentMinute = now.getMinutes();
      
      if (currentSecond !== lastSecond) {
        lastSecond = currentSecond;
        hitSecond();
      }
      
      if (currentMinute !== lastMinute) {
        lastMinute = currentMinute;
        hitMinute();
      }
      
      if (t.h === "00" && t.m === "00" && t.s === "00") {
        hitMidnight();
      }
      
      const shake = state.shake;
      camera.position.x = 
        Math.sin(time * 0.35) * 0.15 + 
        (Math.random() - 0.5) * 0.025 * shake;
      camera.position.y = 
        0.3 + Math.cos(time * 0.28) * 0.08 + 
        (Math.random() - 0.5) * 0.025 * shake;
      camera.position.z = 
        4.5 + Math.sin(time * 0.15) * 0.1;
      camera.lookAt(0, 0, 0);
      
      bloom.strength = state.bloomBase + state.bloomHit;
      bloom.radius = 0.4 + 0.2 * Math.min(1, state.bloomHit);
      
      const glowAmount = 0.35 + state.uiGlow * 0.3;
      const blurAmount = state.uiGlow * 0.8;
      ui.style.filter = `blur(${blurAmount}px) brightness(${1 + glowAmount})`;
      
      const dt = Math.min(0.033, 1 / 60);
      
      for (let i = 0; i < PARTICLE_COUNT; i++) {
        const idx = i * 3;
        const x = positions[idx + 0];
        const y = positions[idx + 1];
        const z = positions[idx + 2];
        
        velocities[idx + 0] += -z * 0.1 * dt;
        velocities[idx + 2] += x * 0.1 * dt;
        
        positions[idx + 0] += velocities[idx + 0] * dt;
        positions[idx + 1] += velocities[idx + 1] * dt;
        positions[idx + 2] += velocities[idx + 2] * dt;
        
        if (y < 0.3 && y > -0.3) {
          positions[idx + 0] *= 0.96;
          positions[idx + 2] *= 0.96;
        }
        
        if (positions[idx + 1] < -1.1) {
          resetParticle(i);
        }
      }
      
      sand.geometry.attributes.position.needsUpdate = true;
      composer.render();
    });

    // RESIZE HANDLER
    window.addEventListener("resize", () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
      composer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>

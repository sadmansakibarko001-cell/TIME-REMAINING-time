<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dhaka Midnight Countdown</title>
  <style>
    :root { color-scheme: dark; }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; background: #000; }
    body {
      display: grid;
      place-items: center;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Courier New", monospace;
      color: #fff;
    }
    .wrap {
      text-align: center;
      padding: 24px;
    }
    h1 {
      font-size: clamp(14px, 2.2vw, 18px);
      font-weight: 600;
      letter-spacing: 0.04em;
      opacity: 0.85;
      margin-bottom: 18px;
    }
    .time {
      font-size: clamp(56px, 10vw, 140px);
      font-weight: 800;
      letter-spacing: 0.06em;
      line-height: 1;
    }
    .time span {
      display: inline-block;
      min-width: 2ch;
      text-align: center;
    }
    .sub {
      margin-top: 14px;
      font-size: 12px;
      opacity: 0.6;
      letter-spacing: 0.02em;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <h1>Time remaining till tomorrow (Asia/Dhaka)</h1>
    <div class="time" aria-label="Countdown timer">
      <span id="hh">00</span>:<span id="mm">00</span>:<span id="ss">00</span>
    </div>
    <div class="sub" id="dateLine"></div>
  </div>

  <script>
    // Minimal version of your original time.js logic (Asia/Dhaka midnight countdown). [file:1]
    const TZ = "Asia/Dhaka";

    function getDhakaParts(date = new Date()) {
      const parts = new Intl.DateTimeFormat("en-GB", {
        timeZone: TZ,
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit",
        hour12: false
      }).formatToParts(date);

      const map = Object.fromEntries(parts.map(p => [p.type, p.value]));
      return {
        year: parseInt(map.year, 10),
        month: parseInt(map.month, 10),
        day: parseInt(map.day, 10),
        hour: parseInt(map.hour, 10),
        minute: parseInt(map.minute, 10),
        second: parseInt(map.second, 10)
      };
    }

    function dhakaLocalToUtcMs({ year, month, day, hour = 0, minute = 0, second = 0 }) {
      const assumedUtc = Date.UTC(year, month - 1, day, hour, minute, second);
      const shown = getDhakaParts(new Date(assumedUtc));
      const shownAsUtc = Date.UTC(shown.year, shown.month - 1, shown.day, shown.hour, shown.minute, shown.second);
      const offsetMs = shownAsUtc - assumedUtc;
      return assumedUtc - offsetMs;
    }

    function msUntilNextDhakaMidnight(now = new Date()) {
      const p = getDhakaParts(now);
      const todayUtc = Date.UTC(p.year, p.month - 1, p.day);
      const tomorrowUtc = todayUtc + 24 * 60 * 60 * 1000;
      const tomorrow = new Date(tomorrowUtc);

      const nextMidnightDhaka = {
        year: tomorrow.getUTCFullYear(),
        month: tomorrow.getUTCMonth() + 1,
        day: tomorrow.getUTCDate(),
        hour: 0,
        minute: 0,
        second: 0
      };

      const nextMidnightUtcMs = dhakaLocalToUtcMs(nextMidnightDhaka);
      return nextMidnightUtcMs - now.getTime();
    }

    function hhmmssFromMs(ms) {
      const totalSeconds = Math.max(0, Math.floor(ms / 1000));
      const h = Math.floor(totalSeconds / 3600);
      const m = Math.floor((totalSeconds % 3600) / 60);
      const s = totalSeconds % 60;
      return {
        h: String(h).padStart(2, "0"),
        m: String(m).padStart(2, "0"),
        s: String(s).padStart(2, "0")
      };
    }

    const hh = document.getElementById("hh");
    const mm = document.getElementById("mm");
    const ss = document.getElementById("ss");
    const dateLine = document.getElementById("dateLine");

    function render() {
      const now = new Date();
      const left = msUntilNextDhakaMidnight(now);
      const t = hhmmssFromMs(left);

      hh.textContent = t.h;
      mm.textContent = t.m;
      ss.textContent = t.s;

      const p = getDhakaParts(now);
      dateLine.textContent = `Dhaka date: ${String(p.day).padStart(2,"0")}-${String(p.month).padStart(2,"0")}-${p.year}`;
    }

    render();
    setInterval(render, 250); // simple, no visual effects; keeps seconds accurate enough. [file:1]
  </script>
</body>
</html>
